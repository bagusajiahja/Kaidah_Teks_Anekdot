<html lang="id">
<head>

<meta name="theme-color" content="#0a2463">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d4ed8'/%3E%3Ctext x='32' y='44' font-size='36' font-family='Arial' font-weight='700' text-anchor='middle' fill='white'%3EA%3C/text%3E%3C/svg%3E">
<style>
/* Rencana tampilan: biru dominan (navy untuk navigasi, biru kobalt untuk aksi), permukaan putih kebiruan.
   Tata letak: sidebar navigasi + kolom konten satu lajur; di ponsel sidebar menjadi laci. Ramah SMA: bersih, huruf besar, penanda warna fungsional. */
:root {
  --bg: #f1f6ff; --surface: #ffffff; --surface2: #e8f0fe; --soft: #d9e6ff;
  --ink: #0d1b3e; --muted: #3f4f78; --line: #bfd0f2;
  --primary: #1d4ed8; --primary-h: #1a3fae; --on-primary: #ffffff;
  --navy: #0a2463; --navy2: #123a9c; --on-navy: #ffffff; --navy-soft: #1b3f9e;
  --ok: #0b6b3f; --ok-bg: #e0f4e9; --bad: #a82218; --bad-bg: #fdeceb;
  --warn: #6f4300; --warn-bg: #fff2cf; --info-bg: #e3edff;
  --mark: #ffe58a; --focus: #1d4ed8; --shadow: 0 1px 2px rgba(10, 36, 99, .08), 0 6px 18px rgba(10, 36, 99, .06);
  --font: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #081433; --surface: #0f1f4a; --surface2: #162a5f; --soft: #1d3575;
    --ink: #e9f0ff; --muted: #b3c1e8; --line: #2c4488;
    --primary: #6f9bff; --primary-h: #8fb2ff; --on-primary: #06122e;
    --navy: #050d24; --navy2: #0c2260; --navy-soft: #16307a;
    --ok: #6fe0a8; --ok-bg: #0f3a2a; --bad: #ffa399; --bad-bg: #44191a;
    --warn: #ffd98a; --warn-bg: #43320a; --info-bg: #14295f;
    --mark: #6b5300; --focus: #a9c4ff; --shadow: 0 1px 2px rgba(0, 0, 0, .4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #081433; --surface: #0f1f4a; --surface2: #162a5f; --soft: #1d3575;
  --ink: #e9f0ff; --muted: #b3c1e8; --line: #2c4488;
  --primary: #6f9bff; --primary-h: #8fb2ff; --on-primary: #06122e;
  --navy: #050d24; --navy2: #0c2260; --navy-soft: #16307a;
  --ok: #6fe0a8; --ok-bg: #0f3a2a; --bad: #ffa399; --bad-bg: #44191a;
  --warn: #ffd98a; --warn-bg: #43320a; --info-bg: #14295f;
  --mark: #6b5300; --focus: #a9c4ff; --shadow: 0 1px 2px rgba(0, 0, 0, .4); color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16.5px; line-height: 1.6; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--navy); }
h1, h2, h3 { line-height: 1.25; margin: 0 0 .5em; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: clamp(1.6rem, 4.5vw, 2.2rem); }
h2 { font-size: 1.28rem; }
h3 { font-size: 1.05rem; margin-top: 1em; }
p { margin: 0 0 .8em; }
a { color: var(--primary); }
mark { background: var(--mark); color: inherit; padding: 0 .18em; border-radius: 4px; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.skip { position: absolute; left: 8px; top: -60px; z-index: 100; background: var(--primary); color: var(--on-primary); padding: 10px 14px; border-radius: 8px; }
.skip:focus { top: calc(8px + env(safe-area-inset-top, 0px)); }

.app { display: grid; grid-template-columns: 296px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--navy); color: var(--on-navy); padding: calc(18px + env(safe-area-inset-top, 0px)) 14px 24px max(14px, env(safe-area-inset-left, 0px)); }
.side :focus-visible { outline-color: #fff; }
.brand { display: flex; gap: 12px; align-items: center; padding: 4px 6px 16px; border-bottom: 1px solid rgba(255, 255, 255, .18); margin-bottom: 8px; }
.logo { flex: none; width: 44px; height: 44px; border-radius: 12px; background: #fff; color: #1d4ed8; display: grid; place-items: center; font-weight: 800; font-size: 1.3rem; }
.brand b { display: block; line-height: 1.2; font-size: 1.02rem; }
.brand small { opacity: .85; font-size: .82rem; }
.ng { margin: 18px 8px 6px; font-size: .74rem; text-transform: uppercase; letter-spacing: .09em; color: #b8cbff; font-weight: 700; }
.side ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.side a { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 8px 10px; border-radius: 10px; color: #fff; text-decoration: none; font-size: .97rem; }
.side a:hover { background: rgba(255, 255, 255, .1); }
.side a[aria-current="page"] { background: #fff; color: #0a2463; font-weight: 700; }
.side a span { flex: 1; min-width: 0; }
.side .tick { flex: none; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: #3ddc97; color: #04301d; }
.side .tick svg { width: 14px; height: 14px; }

.col { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: var(--navy); color: #fff; display: flex; align-items: center; gap: 10px; min-height: 56px; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top :focus-visible { outline-color: #fff; }
.top .ttl { flex: 1; min-width: 0; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.iconbtn { min-width: 44px; min-height: 44px; border-radius: 10px; border: 0; background: rgba(255, 255, 255, .12); color: #fff; display: grid; place-items: center; cursor: pointer; }
.iconbtn:hover { background: rgba(255, 255, 255, .22); }
#menuBtn { display: none; }
.net { font-size: .8rem; font-weight: 700; padding: 5px 10px; border-radius: 999px; background: rgba(255, 255, 255, .14); white-space: nowrap; }
.net.on::before, .net.off::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: #3ddc97; }
.net.off::before { background: #ffc857; }
.main { width: 100%; max-width: 960px; margin: 0 auto; padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; outline: none; }
.main:focus, h1[tabindex="-1"]:focus, #ph:focus, [tabindex="-1"]:focus-visible { outline: none; }
.stack { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.scrim { display: none; }

.phead { padding: 2px 0 2px; }
.eyebrow { margin: 0 0 6px; font-size: .78rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--primary); }
.lead { font-size: 1.08rem; color: var(--muted); max-width: 62ch; margin: .4em 0 0; }
.hint { color: var(--muted); font-size: .92rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); min-width: 0; }
.card > :last-child { margin-bottom: 0; }
.hero { border-radius: 22px; color: #fff; background: radial-gradient(900px 340px at 85% -10%, #3d6bff 0%, rgba(61, 107, 255, 0) 60%), linear-gradient(135deg, #0a2463 0%, #123a9c 55%, #1d4ed8 100%); padding: clamp(22px, 5vw, 44px); }
.hero .eyebrow { color: #cfe0ff; }
.hero h1 { color: #fff; max-width: 20ch; margin-bottom: .3em; }
.hero .lead { color: #e3ecff; }
.hero :focus-visible { outline-color: #fff; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 14px; }
.row.sb { justify-content: space-between; margin-top: 0; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.tpcard { background: var(--surface2); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.tpcard p { font-size: .94rem; }

.btn { font: inherit; font-weight: 700; min-height: 44px; padding: 10px 18px; border-radius: 12px; border: 2px solid transparent; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; line-height: 1.2; text-align: center; }
.btn.primary { background: var(--primary); color: var(--on-primary); }
.btn.primary:hover { background: var(--primary-h); }
.btn.ghost { background: transparent; color: var(--primary); border-color: var(--primary); }
.btn.ghost:hover { background: var(--soft); }
.btn.light { background: #fff; color: #0a2463; }
.btn.light:hover { background: #e3ecff; }
.btn.outline { background: transparent; color: #fff; border-color: #fff; }
.btn.outline:hover { background: rgba(255, 255, 255, .14); }
.btn.link { background: transparent; color: var(--primary); text-decoration: underline; padding: 6px 8px; min-height: 36px; }
.btn.danger { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }
.btn:disabled { opacity: .55; cursor: not-allowed; }

.chip { display: inline-block; font-size: .8rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--surface2); border: 1px solid var(--line); color: var(--ink); line-height: 1.5; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: .8em; }
.chip.lv { background: var(--soft); color: var(--ink); border-color: var(--primary); }
.chip.k-mahir { background: var(--ok-bg); color: var(--ok); border-color: var(--ok); }
.chip.k-cakap { background: var(--info-bg); color: var(--primary); border-color: var(--primary); }
.chip.k-mulai { background: var(--warn-bg); color: var(--warn); border-color: var(--warn); }
.chip.k-belum { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }

.callout { border-radius: 12px; padding: 12px 16px; border: 1px solid var(--line); margin: 12px 0; }
.callout p { margin: .25em 0 0; }
.callout.info { background: var(--info-bg); border-color: var(--primary); }
.callout.ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.callout.ok p, .callout.ok strong { color: var(--ok); }
.callout.warn { background: var(--warn-bg); border-color: var(--warn); color: var(--warn); }

.field { display: flex; flex-direction: column; gap: 6px; margin: 12px 0; min-width: 0; }
label { font-weight: 600; }
textarea, input[type="text"], input[type="url"], input[type="search"], select { font: inherit; width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); }
textarea { resize: vertical; min-height: 90px; }
textarea:read-only { background: var(--surface2); }
textarea:focus, input:focus, select:focus { border-color: var(--primary); }
.radios { border: 0; padding: 0; margin: 12px 0; min-width: 0; }
.radios legend { font-weight: 600; padding: 0; margin-bottom: 4px; }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 10px; min-height: 44px; }
.opt:hover { background: var(--surface2); }
.opt input { flex: none; width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--primary); }
.opt label { font-weight: 500; cursor: pointer; }
.selfcb { display: flex; gap: 10px; align-items: flex-start; margin: 10px 0; }
.selfcb input { width: 22px; height: 22px; flex: none; margin-top: 2px; accent-color: var(--primary); }
.checks { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 12px 0; }
.checks legend { font-weight: 700; padding: 0 6px; }

.q { padding: 16px 0; border-top: 1px solid var(--line); }
.q:first-child { border-top: 0; padding-top: 0; }
.qhead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; }
.qid { font-weight: 800; color: #fff; background: var(--navy2); padding: 2px 12px; border-radius: 8px; font-size: .9rem; }
.qtext { font-weight: 600; font-size: 1.04rem; }
.result { margin-top: 12px; }
.score { margin: 10px 0; font-size: 1.02rem; }
.plist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.plist li { display: flex; gap: 10px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); }
.plist li p { margin: 2px 0 0; font-size: .94rem; }
.plist li svg { flex: none; margin-top: 2px; }
.plist li.ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.plist li.bad { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.plist li .selfcb label { color: var(--ink); font-weight: 500; }
.det { margin: 10px 0; padding: 8px 12px; border: 1px dashed var(--line); border-radius: 10px; }
.det summary { cursor: pointer; font-weight: 700; min-height: 32px; }
.sumbar { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 16px; }
.sumbar p { margin: 0; }
.keybox { margin-top: 8px; }

.teks { margin: 0 0 12px; padding: 16px 18px; background: var(--surface2); border-left: 6px solid var(--primary); border-radius: 12px; }
.teks figcaption { font-weight: 800; margin-bottom: 8px; color: var(--primary); }
.teks p { margin-bottom: .6em; }
.segs { display: grid; gap: 8px; margin: 12px 0; }
.seg { font: inherit; text-align: left; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; min-height: 44px; }
.seg:hover { border-color: var(--primary); }
.seg[aria-pressed="true"] { border-color: var(--primary); background: var(--soft); font-weight: 600; }
.kcards { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); }
.kcard { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.ktext { font-size: 1.05rem; font-weight: 600; }
.kn { display: block; font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--primary); font-weight: 800; }
.fb { margin-top: 8px; font-size: .94rem; }
.fb.ok { color: var(--ok); } .fb.bad { color: var(--bad); }

.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.tabs button { flex: none; font: inherit; font-weight: 700; min-height: 44px; padding: 8px 14px; border-radius: 999px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.panel { min-width: 0; }
.pn { margin-top: 18px; }
.acc { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.acc summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 10px 16px; font-weight: 700; }
.acc summary::-webkit-details-marker { display: none; }
.acc summary::after { content: "›"; margin-left: auto; font-size: 1.4rem; transition: transform .2s; }
.acc[open] summary::after { transform: rotate(90deg); }
.acc[open] summary { background: var(--surface2); }
.accb { padding: 14px 16px 16px; }
.kb { flex: none; width: 32px; height: 32px; border-radius: 9px; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; font-weight: 800; }
.ex { background: var(--surface2); padding: 8px 12px; border-radius: 10px; }
.uji { min-height: 120px; }
.uq { font-size: 1.1rem; font-weight: 700; }
.bul { margin: 0 0 .8em; padding-left: 1.2em; } .bul li { margin-bottom: .35em; }
.flow { margin: 0; padding-left: 1.3em; } .flow li { margin-bottom: .5em; }
.gl dt { font-weight: 800; margin-top: 12px; color: var(--primary); } .gl dd { margin: 2px 0 0; }

.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); max-width: 100%; }
table { border-collapse: collapse; width: 100%; min-width: 560px; font-size: .94rem; }
th, td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--line); }
thead th { background: var(--soft); font-weight: 800; position: sticky; top: 0; }
tbody tr:last-child th, tbody tr:last-child td { border-bottom: 0; }
tbody th { font-weight: 700; background: var(--surface2); }
td.q { font-style: italic; border-top: 0; padding: 10px 12px; }

.bar { height: 14px; background: var(--surface2); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; margin: 8px 0; }
.bar span { display: block; height: 100%; background: var(--primary); border-radius: 999px; transition: width .4s; }
.bar span.k-mahir { background: #168a54; } .bar span.k-cakap { background: var(--primary); } .bar span.k-mulai { background: #d18a00; } .bar span.k-belum { background: #c53a2f; }

#toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--navy); color: #fff; padding: 12px 18px; border-radius: 12px; max-width: min(92vw, 520px); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 90; box-shadow: 0 8px 24px rgba(0, 0, 0, .3); font-weight: 600; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 959px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; z-index: 70; left: 0; top: 0; bottom: 0; height: auto; width: min(86vw, 320px); transform: translateX(-105%); transition: transform .25s; box-shadow: 8px 0 30px rgba(0, 0, 0, .35); }
  body.navopen .side { transform: none; }
  body.navopen .scrim { display: block; position: fixed; inset: 0; background: rgba(5, 13, 36, .55); z-index: 65; }
  #menuBtn { display: grid; }
  .row2 { grid-template-columns: 1fr; }
}
@media (max-width: 480px) {
  body { font-size: 16px; }
  .card { padding: 16px; border-radius: 14px; }
  .btn { width: 100%; }
  .row .btn { flex: 1 1 100%; }
  .tabs button { padding: 8px 12px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
@media print {
  body::before, .side, .top, .scrim, #toast, .btn, .tabs, .skip { display: none !important; }
  .app { display: block; } .main { max-width: none; padding: 0; } .card, .tw { box-shadow: none; break-inside: avoid; }
  body { background: #fff; color: #000; }
}

</style>

<body>
<a class="skip" href="#main" onclick="document.getElementById('main').focus()">Lewati ke konten</a>
<div class="app">
  <aside class="side" aria-label="Navigasi">
    <div class="brand"><div class="logo" aria-hidden="true">A</div><div><b>Belajar Anekdot</b><small>Kaidah kebahasaan · Kelas X</small></div></div>
    <nav id="nav" aria-label="Menu belajar"></nav>
  </aside>
  <div class="col">
    <header class="top">
      <button class="iconbtn" id="menuBtn" type="button" aria-label="Buka menu" aria-expanded="false" aria-controls="nav"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg></button>
      <div class="ttl">Belajar Kaidah Anekdot</div>
      <span class="net on" id="net" role="status">Daring</span>

    </header>
    <main id="main" class="main" tabindex="-1"></main>
  </div>
</div>
<div class="scrim" id="scrim"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/* DATA: seluruh isi materi, soal, kunci, dan komponen penskoran (selaras dengan Bahan Ajar Revisi) */
var D = {};

D.kaidahOpsi = [
  ['', '— pilih kaidah —'],
  ['lampau', 'a. Kalimat bermakna lampau'],
  ['retoris', 'b. Kalimat retoris'],
  ['temporal', 'c. Konjungsi temporal'],
  ['sebab', 'd. Konjungsi sebab-akibat'],
  ['material', 'e. Kata kerja material'],
  ['dialog', 'f. Kalimat langsung / tidak langsung'],
  ['majas', 'g. Majas sindiran (ironi, sinisme, sarkasme)']
];
D.kaidahNama = { lampau: 'Kalimat bermakna lampau', retoris: 'Kalimat retoris', temporal: 'Konjungsi temporal', sebab: 'Konjungsi sebab-akibat', material: 'Kata kerja material', dialog: 'Kalimat langsung/tidak langsung', majas: 'Majas sindiran', perintah: 'Kalimat perintah/seru' };

D.kaidah = [

    document.getElementById('themeBtn').addEventListener('click', function () { S.theme = S.theme === 'dark' ? 'light' : (S.theme === 'light' ? '' : 'dark'); save(); applyTheme(); toast('Tampilan: ' + (S.theme === 'dark' ? 'gelap' : (S.theme === 'light' ? 'terang' : 'ikuti perangkat'))); });
    window.addEventListener('hashchange', render);
    window.addEventListener('online', function () { netBadge(); if (S.sync.dirty && S.set.url && !IN_ARTIFACT) sendNow(true); });
    window.addEventListener('offline', netBadge);
    window.addEventListener('beforeunload', save);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') document.body.classList.remove('navopen'); });
    render(); netBadge();
    if (!IN_ARTIFACT && location.protocol.indexOf('http') === 0) {
      try { var l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.json'; document.head.appendChild(l); } catch (e) { }
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () { });
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();

</script>
